version: "3.8"

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: cyclone_postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyclone_db
      POSTGRES_USER: cyclone
      POSTGRES_PASSWORD: cyclone_dev_pw   # change for anything beyond local dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./data_pipeline/db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql

volumes:
  pgdata:
